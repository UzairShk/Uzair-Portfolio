<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uzair-portfolio</title>
    <link rel="stylesheet" href="/Uzair-Portfolio/public/site.css" />
    <script>
      window.addEventListener("error", (event) => {
        const failedScript = event.target;
        if (
          !(failedScript instanceof HTMLScriptElement) ||
          !failedScript.src.endsWith("/src/main.jsx")
        ) {
          return;
        }

        const bundle = document.createElement("script");
        bundle.type = "module";
        bundle.src = "/Uzair-Portfolio/public/site.js";
        document.body.appendChild(bundle);
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
